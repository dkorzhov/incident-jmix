services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: incident
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incident"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
